<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockPaperScissor Game</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io1/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io1/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io1/">
<link rel="manifest" href="favicon_io1/site.webmanifest">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="theme">
    <button id="themeBtn">🌙</button>
    </div>
    <div class="choices">
        <div class="choice" id="rock">
           <img src="imagesforgame/rock-icon.png">
        </div>
        <div class="choice" id="paper">
           <img src="imagesforgame/paper-icon.png">
        </div>
        <div class="choice" id="scissors">
           <img src="imagesforgame/scissors-icon.png">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
    <div class="feedback-section">
        <h3>Enjoying the calculator?</h3>
        <p>I'd love to hear your feedback!</p>
        <a href="" rel="noopener noreferrer" class="feedback-button">⭐ Give Feedback</a>
    </div>
</body>
<script src="app.js"></script>
</html>
